apply plugin: 'com.android.application'

// Always-increasing version code: 100 + GitHub Actions run number
// (GITHUB_RUN_NUMBER is set by GitHub automatically for every build), or
// VERSION_CODE if given explicitly; local builds fall back to 12.
static int dotsVersionCode() {
    String v = System.getenv("VERSION_CODE")
    if (v != null && v.trim()) return Integer.parseInt(v.trim())
    String run = System.getenv("GITHUB_RUN_NUMBER")
    if (run != null && run.trim()) return 100 + Integer.parseInt(run.trim())
    return 13
}

android {
    namespace 'com.dotswar.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.dotswar.app"
        minSdk 21
        targetSdk 36
        // versionCode is taken from the VERSION_CODE env var when building on
        // GitHub Actions (100 + run number, always increasing), so you never
        // have to bump it by hand. Local builds fall back to the number below.
        versionCode = dotsVersionCode()
        versionName "2.4.0"
    }

    // Release signing config is populated from environment variables so the
    // real keystore/passwords never need to be committed to the repo — set
    // them as GitHub Actions secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD,
    // KEY_ALIAS, KEY_PASSWORD) and the CI workflow wires them in. Building
    // locally in Android Studio without these env vars still works for
    // debug builds; release builds will just be unsigned until you export
    // the same variables in your shell.
    signingConfigs {
        // Committed on purpose (debug keys aren't secret) so every machine
        // and every CI run signs debug builds with the exact same
        // certificate. Without this, Gradle auto-generates a fresh random
        // debug key per machine/run, and Android refuses to install a new
        // APK over a previously installed one signed with a different key
        // ("App not installed" / signature mismatch) — that's what broke
        // the last debug APK.
        debug {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            def ksPath = System.getenv("KEYSTORE_PATH")
            if (ksPath != null) {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    // The whole game lives in a single offline-capable HTML file loaded by
    // the WebView, so no res/layout, no extra native libraries.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // WebViewAssetLoader: serves the bundled game from https://appassets.androidplatform.net/
    // instead of file:// — gives the page a real origin, so localStorage, history (Back
    // button), Web Workers (AI engine) and Firebase all behave exactly as in a browser.
    implementation 'androidx.webkit:webkit:1.12.1'
    // WindowCompat / ViewCompat for edge-to-edge and safe-area insets
    implementation 'androidx.core:core:1.13.1'
    // Native Google sign-in (Credential Manager) -> ID token handed to Firebase Auth inside the page
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
